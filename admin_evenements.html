<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Événements</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <main style="max-width: 700px; margin: 60px auto; padding: 0 24px;">

        <div id="loginDiv">
            <h1>Connexion Admin</h1>
            <form>
                <div>
                    <label for="username">Nom d'utilisateur</label>
                    <input type="text" id="username" placeholder="Nom d'utilisateur" autocomplete="username">
                </div>
                <div>
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" placeholder="Mot de passe" autocomplete="current-password">
                </div>
                <button type="button" id="btnLogin" class="btn">Se connecter</button>
                <div id="errorMsg" class="error" role="alert"></div>
            </form>
        </div>

        <div id="adminDiv" class="hidden">
            <h1>Gestion des événements</h1>

            <div class="section-ajout">
                <h2>Ajouter un événement</h2>
                <div id="feedbackAjout" role="alert"></div>
                <form>
                    <div>
                        <label for="newType">Type</label>
                        <input type="text" id="newType" placeholder="ex : Débat, Projection, Atelier...">
                    </div>
                    <div>
                        <label for="newTitre">Titre</label>
                        <input type="text" id="newTitre" placeholder="Titre de l'événement">
                    </div>
                    <div>
                        <label for="newDate">Date</label>
                        <input type="date" id="newDate">
                    </div>
                    <div>
                        <label for="newLieu">Lieu</label>
                        <input type="text" id="newLieu" placeholder="ex : Restaurant Le Zinc, Lyon">
                    </div>
                    <div>
                        <label for="newDescription">Description</label>
                        <textarea id="newDescription" placeholder="Description" rows="3"></textarea>
                    </div>
                    <button type="button" id="btnAjouter" class="btn">Ajouter</button>
                </form>
            </div>

            <h2>Liste des événements</h2>
            <div id="feedbackListe" role="alert"></div>
            <div id="evenementsList"></div>

            <button type="button" id="btnDeconnexion" class="btn-deconnexion">Déconnexion</button>
        </div>

    </main>

    <script src="scripts/admin-evenements.js" defer></script>
</body>
</html>
