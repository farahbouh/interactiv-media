<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Admin - Événements</title>

</head>
<body>
    <!-- Formulaire de connexion -->
    <div id="loginDiv" class="login-form">
        <h2>Connexion Admin</h2>
        <input type="text" id="username" placeholder="Nom d'utilisateur"><br>
        <input type="password" id="password" placeholder="Mot de passe"><br>
        <button onclick="login()">Se connecter</button>
        <div id="errorMsg" class="error"></div>
    </div>

    <!-- Interface admin (masquée jusqu'à connexion) -->
    <div id="adminDiv" style="display:none;">
        <h1>Gestion des événements</h1>

        <div style="background: #e9ecef; padding: 15px; margin-bottom: 20px;">
            <h3>Ajouter un événement</h3>
            <input type="text" id="newTitre" placeholder="Titre"><br>
            <input type="text" id="newDate" placeholder="Date (ex: 18 juin 2026)"><br>
            <textarea id="newDescription" placeholder="Description" rows="3"></textarea><br>
            <button onclick="ajouterEvenement()">Ajouter</button>
        </div>

        <h3>Liste des événements</h3>
        <div id="evenementsList"></div>

        <button onclick="deconnexion()" style="background:#6c757d; margin-top: 20px;">Déconnexion</button>
    </div>

    <script src="scripts/admin-evenements.js"></script>
</body>
</html>
