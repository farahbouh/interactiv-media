name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest flask flask-cors supabase
      - name: Run tests
        env:
          SUPABASE_URL: "https://fake.supabase.co"
          SUPABASE_KEY: "fake-key-for-ci"
          ADMIN_USERNAME: "tuteur"
          ADMIN_PASSWORD: "motdepasse123"
        run: pytest tests/test_evenements.py -v